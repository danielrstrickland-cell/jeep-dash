name: Build Jeep Link Test app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jeep-link-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jeep-link-test-apk
          path: jeep-link-test.apk

      - name: Publish as a release (easy download on the tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: link-test-${{ github.run_number }}
          name: Jeep Link Test (build ${{ github.run_number }})
          body: Throwaway test app. Download jeep-link-test.apk on the tablet and install it.
          files: jeep-link-test.apk
          prerelease: true
