plugins {
    id 'com.android.application'
}

// Build number from GitHub Actions; it is also the version code the update check compares against.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// The signing key is committed as base64 text (the GitHub connector can only push text files).
// A fixed key lets every new build install over the previous one.
def keystoreFile = layout.buildDirectory.file('signing/jeepdash.keystore').get().asFile
if (!keystoreFile.exists()) {
    keystoreFile.parentFile.mkdirs()
    keystoreFile.bytes = file('jeepdash.keystore.b64').text.replaceAll('\\s', '').decodeBase64()
}

android {
    namespace 'com.strickland.jeepdash'
    compileSdk 35

    defaultConfig {
        applicationId 'com.strickland.jeepdash'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
        // Filament's native code: the tablet (64-bit) and 32-bit radios, so the app still installs on both
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // keep the native libraries compressed in the APK: a smaller download for the update check
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    // the 3D view reads these straight from the APK without a copy
    androidResources {
        noCompress 'glb', 'ktx', 'filamat'
    }

    signingConfigs {
        jeepdash {
            storeFile keystoreFile
            storePassword 'jeepdash'
            keyAlias 'jeepdash'
            keyPassword 'jeepdash'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.jeepdash
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':core')
    // Google's Filament (real-time PBR) and its glTF loader, for the Holo look's 3D truck. Pinned to the version
    // whose jars the local compile check uses. androidx annotations are only annotations: left out, as the app
    // does not use AndroidX.
    implementation('com.google.android.filament:filament-android:1.69.5') { exclude group: 'androidx.annotation' }
    implementation('com.google.android.filament:gltfio-android:1.69.5') { exclude group: 'androidx.annotation' }
}
