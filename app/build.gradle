plugins {
    id 'com.android.application'
}

android {
    namespace 'com.strickland.jeepdash.linktest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.strickland.jeepdash.linktest'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-linktest'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
